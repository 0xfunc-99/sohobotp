# Builds SohobOTP Sign-in (Windows sign-in component) and the SohobOTP agent MSI on Windows.
name: windows-signin
on:
  push:
    paths: ["windows-signin/**", ".github/workflows/windows-signin.yml"]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Embedded PHP runtime (pinned upstream commit)
        shell: pwsh
        run: ./windows-signin/get-php.ps1
      - name: WiX Toolset 3.14
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) { choco install wixtoolset --version 3.14.1 -y --no-progress }
      - uses: microsoft/setup-msbuild@v2
      - name: Build (Release x64)
        run: msbuild windows-signin\SohobOTPSignIn.sln /m /p:Configuration=Release /p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: SohobOTPSignIn-x64
          path: |
            windows-signin/CredentialProvider/bin/x64/Release/SohobOTPSignIn.dll
            windows-signin/CredentialProviderFilter/bin/x64/Release/SohobOTPSignInFilter.dll
            windows-signin/WixInstall/multiOTPCredentialProviderInstaller/bin/**/*.msi
