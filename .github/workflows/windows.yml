# Windows build and test of SohobOTP: the agent (+ MSI) is built on Linux, SohobOTP Sign-in is
# compiled on Windows, then a Windows machine runs the agent's Windows tests and the full
# end-to-end test (agent/tests/windows/e2e.ps1) with both MSIs.
name: windows
on:
  push: {}
  workflow_dispatch: {}
jobs:
  agent-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Agent tests and builds (Linux and Windows binaries)
        run: sh agent/tests/run-in-docker.sh
      - name: Agent MSI
        run: sh agent/packaging/windows/build-msi.sh
      - name: Agent 0.1.1 and its MSI (upgrade test)
        run: |
          docker run --rm -v "$PWD":/src -w /src/agent -e GOOS=windows -e GOARCH=amd64 -e CGO_ENABLED=0 golang:1.22.10-bookworm \
            go build -buildvcs=false -trimpath -ldflags "-s -w -X multiotp-portal/agent/internal/inventory.Version=0.1.1" -o dist/upgrade/sohobotp-agent-windows-amd64.exe ./cmd/sohobotp-agent
          AGENT_VERSION=0.1.1 AGENT_EXE=dist/upgrade/sohobotp-agent-windows-amd64.exe MSI_OUT=dist/upgrade/sohobotp-agent-0.1.1.msi sh agent/packaging/windows/build-msi.sh
      - name: Test portal for Windows
        run: |
          docker run --rm -v "$PWD":/src -w /src/agent -e GOOS=windows -e GOARCH=amd64 -e CGO_ENABLED=0 \
            golang:1.22.10-bookworm go build -buildvcs=false -o dist/fakeportal.exe ./tests/fakeportal
      - uses: actions/upload-artifact@v4
        with:
          name: agent-windows
          path: |
            agent/dist/sohobotp-agent.msi
            agent/dist/sohobotp-agent-windows-amd64.exe
            agent/dist/fakeportal.exe
            agent/dist/upgrade/sohobotp-agent-0.1.1.msi

  signin-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Embedded PHP runtime (pinned upstream commit)
        shell: pwsh
        run: ./windows-signin/get-php.ps1
      - name: WiX Toolset 3.14
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) { choco install wixtoolset --version 3.14.1 -y --no-progress }
      - name: ATL and Spectre-mitigated libraries for the v142 toolset, x64 and ARM64 (the projects use ATL and build with /Qspectre)
        # the Visual Studio installer sometimes hangs on the runner (once for 2 hours): fail fast instead
        timeout-minutes: 30
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $p = Start-Process -Wait -PassThru "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" -ArgumentList "modify --installPath `"$vs`" --add Microsoft.VisualStudio.Component.VC.14.29.16.11.x86.x64.Spectre --add Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL --add Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL.Spectre --add Microsoft.VisualStudio.Component.VC.14.29.16.11.ARM64 --add Microsoft.VisualStudio.Component.VC.14.29.16.11.ARM64.Spectre --add Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL.ARM64 --add Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL.ARM64.Spectre --quiet --norestart --nocache"
          Write-Host "vs_installer exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }
      - uses: microsoft/setup-msbuild@v2
      - name: Build SohobOTP Sign-in (Release x64)
        run: msbuild windows-signin\SohobOTPSignIn.sln /m /p:Configuration=Release /p:Platform=x64
      - name: Build SohobOTP Sign-in (Release ARM64, for Windows on ARM)
        run: msbuild windows-signin\SohobOTPSignIn.sln /m /p:Configuration=Release /p:Platform=ARM64
      - name: ARM64 installer (the 64-bit package with the ARM64 DLLs)
        working-directory: windows-signin\WixInstall\multiOTPCredentialProviderInstaller
        run: msbuild multiOTPCredentialProviderInstaller.wixproj /t:Rebuild /p:Configuration=Release /p:Platform=x64 /p:DefineConstants=BinArch=ARM64 /p:OutputName=SohobOTPSignIn_arm64 /p:OutputPath=bin\arm64\Release\ /p:IntermediateOutputPath=obj\arm64\Release\
      - name: Collect
        shell: pwsh
        run: |
          # PE header machine type: 0x8664 x64, 0xAA64 ARM64
          function Machine($f) { $b = [IO.File]::ReadAllBytes($f); $pe = [BitConverter]::ToInt32($b, 0x3C); '{0:X4}' -f [BitConverter]::ToUInt16($b, $pe + 4) }
          New-Item -ItemType Directory -Force out, out\arm64 | Out-Null
          foreach ($d in 'CredentialProvider\bin\x64\Release\SohobOTPSignIn.dll', 'CredentialProviderFilter\bin\x64\Release\SohobOTPSignInFilter.dll') {
            $f = "windows-signin\$d"; if ((Machine $f) -ne '8664') { throw "$f is not x64" }; Copy-Item $f out }
          foreach ($d in 'CredentialProvider\bin\ARM64\Release\SohobOTPSignIn.dll', 'CredentialProviderFilter\bin\ARM64\Release\SohobOTPSignInFilter.dll') {
            $f = "windows-signin\$d"; if ((Machine $f) -ne 'AA64') { throw "$f is not ARM64" }; Copy-Item $f out\arm64 }
          $w = 'windows-signin\WixInstall\multiOTPCredentialProviderInstaller\bin'
          Copy-Item "$w\x64\Release\SohobOTPSignIn.msi" out
          Copy-Item "$w\arm64\Release\SohobOTPSignIn_arm64.msi" out\arm64
          # the ARM64 package must carry the ARM64 DLLs: extract it and check
          $x = "$env:RUNNER_TEMP\arm64-msi"; Start-Process -Wait msiexec -ArgumentList "/a `"$((Resolve-Path out\arm64\SohobOTPSignIn_arm64.msi).Path)`" /qn TARGETDIR=`"$x`""
          $inside = Get-ChildItem -Recurse $x -Include SohobOTPSignIn.dll, SohobOTPSignInFilter.dll
          if ($inside.Count -ne 2) { throw "ARM64 package: sign-in DLLs not found" }
          foreach ($f in $inside) { if ((Machine $f.FullName) -ne 'AA64') { throw "ARM64 package contains a non-ARM64 $($f.Name)" } }
          Write-Host "x64 and ARM64 DLLs and installers checked"
          Get-ChildItem -Recurse out
      - uses: actions/upload-artifact@v4
        with:
          name: signin-windows
          path: out/

  windows-test:
    needs: [agent-build, signin-build]
    if: always() && needs.agent-build.result == 'success'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.10"
      - name: Agent unit tests on Windows (real registry, DPAPI)
        working-directory: agent
        run: go test -count=1 ./...
      - uses: actions/download-artifact@v4
        with:
          name: agent-windows
          path: agent-out
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: signin-windows
          path: signin-out
      - name: End-to-end test
        shell: pwsh
        run: |
          $signin = Get-ChildItem signin-out -Filter *.msi -ErrorAction SilentlyContinue | Where-Object { $_.Name -notmatch 'x86' } | Select-Object -First 1
          $params = @{ AgentMsi = (Resolve-Path agent-out/sohobotp-agent.msi).Path; FakePortal = (Resolve-Path agent-out/fakeportal.exe).Path; Work = "$env:RUNNER_TEMP\sohobotp-e2e"
                       UpgradeMsi = (Resolve-Path agent-out/upgrade/sohobotp-agent-0.1.1.msi).Path }
          if ($signin) { $params.SignInMsi = $signin.FullName; Write-Host "with SohobOTP Sign-in: $($signin.Name)" } else { Write-Host "SohobOTP Sign-in not built: testing the agent with its registry key only" }
          & ./agent/tests/windows/e2e.ps1 @params
          $rc = $LASTEXITCODE
          # upload-artifact needs the files under the workspace (the temp folder is on another drive)
          New-Item -ItemType Directory -Force e2e-logs | Out-Null
          Copy-Item "$env:RUNNER_TEMP\sohobotp-e2e\*.log" e2e-logs -ErrorAction SilentlyContinue
          Copy-Item "C:\ProgramData\SohobOTP\agent\agent.log" e2e-logs -ErrorAction SilentlyContinue
          exit $rc
      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: e2e-logs/
